name: Build GNP API for Ubuntu 22.X

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive


      # Step 2: Install dependencies for Drogon, PostgreSQL, and Redis
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ libjsoncpp-dev uuid-dev openssl libssl-dev zlib1g-dev
          sudo apt install postgresql libhiredis-dev  doxygen graphviz dia
          sudo apt-get install -y libmupdf-dev libfreetype-dev libharfbuzz-dev libjbig2dec0-dev libgumbo-dev libmujs-dev libopenjp2-7-dev libjpeg-dev
          

      # Step 3: Download and install Drogon
      # Pinned to v1.9.13: v1.9.14 (commit c79f2d3a, PR #2560) changed
      # HttpRequestParser's Expect: 100-continue handling — chunked requests
      # carrying "Expect: 100-continue" no longer get the interim response and
      # deadlock until the client times out. See
      # docs/drogon-1.9.14-expect-100-continue-regression.md. Unpin once
      # upstream ships a fix.
      - name: Install Drogon
        run: |
          git clone https://github.com/drogonframework/drogon.git
          cd drogon
          git checkout v1.9.13
          git submodule update --init --recursive
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_POSTGRESQL=ON ..
          make -j$(nproc)
          sudo make install
          cd ../..  # Move back to the root directory

      # Step 4: Remove any existing build directory to prevent CMake cache conflicts
      - name: Clean previous build
        run: |
          rm -rf build
          mkdir build

      # Step 5: Build your application
      - name: Build Application
        run: |
          cd build
          cmake ..
          make

      # Step 6: List files in the build directory
      - name: List build directory files
        run: |
          cd build
          ls -l

      # Step 7: Upload the binary as an artifact using v3
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: gnp-api
          path: build/GnpApi

